name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          POKEIQ_SECRET: ci-only-secret-not-used-anywhere-else
          POKEIQ_LOCAL_ACCOUNTS: "1"
      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm start -- -p 3000 &
          npx wait-on -t 60000 http://localhost:3000
          npm run verify:e2e
        env:
          POKEIQ_SECRET: ci-only-secret-not-used-anywhere-else
          POKEIQ_LOCAL_ACCOUNTS: "1"
          # TCG pages read a captured slice of real Pokémon TCG API data instead of the live API.
          POKEIQ_TCG_FIXTURE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
